# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "variscite-sdk-common"
BBFILE_PATTERN_variscite-sdk-common := "^${LAYERDIR}/"
BBFILE_PRIORITY_variscite-sdk-common = "16"

LAYERSERIES_COMPAT_variscite-sdk-common = " \
    dunfell \
    langdale \
    mickledore \
    scarthgap \
"

# Both Chromium and qtpdf6 require gn-native.
# Both meta-browser and meta-qt6 bring a recipe to build gn-native
# but only the version provided by meta-qt6 can build both packages
# See https://bugreports.qt.io/browse/QTBUG-133263 for details
PREFERRED_VERSION_gn-native ??= "${QT_VERSION}"
